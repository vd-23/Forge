name: Forge

fileGroups:
  - docs
  - project.yml
  - Brewfile

options:
  bundleIdPrefix: com.forge
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ForgeCore:
    path: Packages/ForgeCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Free personal team: profiles expire after 7 days, and no entitlement that
    # needs the paid programme (App Groups, push) can be provisioned.
    DEVELOPMENT_TEAM: YLDXG3RWUU
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Forge:
    type: application
    platform: iOS
    sources:
      - path: Forge
    dependencies:
      - package: ForgeCore
      - target: ForgeWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forge.gym
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: Forge/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.forge.gym.backup
            UTTypeDescription: Forge backup
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [forgebackup]

  ForgeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ForgeWidgets
      - path: Forge/Shared/RestActivityAttributes.swift
    info:
      path: ForgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Forge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forge.gym.widgets
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ForgeTests
    dependencies:
      - target: Forge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forge.gym.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Forge:
    build:
      targets:
        Forge: all
        ForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForgeTests
